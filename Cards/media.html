<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    .media-card {
      width: 280px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden; /* Ensures image fits curved top corners */
      background-color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .media-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .media-card-content {
      padding: 16px;
    }

    .media-card-content h3 {
      margin: 0 0 8px 0;
      color: #333;
    }

    .media-card-content p {
      margin: 0 0 16px 0;
      color: #666;
      font-size: 14px;
    }

    .media-card-button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="media-card">
    <img src="https://via.placeholder.com/280x150" alt="Card Banner">
    <div class="media-card-content">
      <h3>Web Development</h3>
      <p>Learn how to build responsive layouts using HTML and CSS containers.</p>
      <button class="media-card-button">Enroll Now</button>
    </div>
  </div>

</body>
</html>
