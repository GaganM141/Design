<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Text Card</title>
    <style>
        .basic-card h3{
            margin-top: 0;
            columns: #333;

        }

        .basic-card p{
            columns: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        .basic-card a{
            columns: #0066cc;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .basic-card a:hover{
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="basic-card">
        <h3>Announcement</h3>
        <p>System maintenance is scheduled for this sunday at 2:00 AM</p>
        <a href="#">Read details &rarr;</a>
    </div>
</body>
</html>
